services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15.4-alpine
    container_name: print3d-postgres
    environment:
      - POSTGRES_USER=print3d
      - POSTGRES_PASSWORD=print3d
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "print3d"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - print3d-network

  # Message Broker
  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    container_name: print3d-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=print3d
      - RABBITMQ_DEFAULT_PASS=print3d
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - print3d-network

  # Redis para idempotencia
  redis:
    image: redis:7
    container_name: print3d-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - print3d-network
      


  # Servicios de la aplicación
  quotation-service:
    build:
      context: ./quotation-service
      dockerfile: Dockerfile
    container_name: quotation-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/quotation_db
      - SPRING_DATASOURCE_USERNAME=print3d
      - SPRING_DATASOURCE_PASSWORD=print3d
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=print3d
      - SPRING_RABBITMQ_PASSWORD=print3d
      - SPRING_REDIS_HOST=redis
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - print3d-network

  # Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=print3d
      - SPRING_DATASOURCE_PASSWORD=print3d
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=print3d
      - SPRING_RABBITMQ_PASSWORD=print3d
      - SPRING_REDIS_HOST=redis
      - SERVER_PORT=8082
      - GRPC_SERVER_PORT=9090
      - SPRING_CONTEXT_PATH=/api
    ports:
      - "9090:9090"
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - print3d-network

  invoice-service:
    build:
      context: ./invoice-service
      dockerfile: Dockerfile
    container_name: invoice-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/invoice_db
      - SPRING_DATASOURCE_USERNAME=print3d
      - SPRING_DATASOURCE_PASSWORD=print3d
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=print3d
      - SPRING_RABBITMQ_PASSWORD=print3d
      - SPRING_REDIS_HOST=redis
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ws/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - print3d-network

# Redes y volúmenes
  # Servicio para ejecutar pruebas del servicio de cotizaciones
  quotation-tests:
    build:
      context: .
      dockerfile: ./quotation-service/Dockerfile.test
    container_name: quotation-tests
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/quotation_db
      - SPRING_DATASOURCE_USERNAME=print3d
      - SPRING_DATASOURCE_PASSWORD=print3d
    networks:
      - print3d-network

networks:
  print3d-network:
    driver: bridge

volumes:
  pgdata:
